<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout | Mrinmaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Libre+Baskerville:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/checkout.css"><link rel="stylesheet" href="css/inner-pages.css"><link rel="stylesheet" href="css/cart-drawer.css">
  <script src="js/store.js" defer></script><script src="js/inner-header.js" defer></script><script src="js/cart-pages.js" defer></script><script src="js/cart-drawer.js" defer></script>
</head>
<body class="inner-page" data-page="checkout">
  <header data-inner-header data-active="products"></header>
  <section class="inner-banner"><div class="inner-banner__content"><p class="eyebrow">Almost there</p><h1>Checkout</h1><p>Share your delivery details and we will take care of the rest.</p></div></section>
  <main class="checkout-shell"><div class="cart-layout"><section class="form-panel"><h2>Delivery details</h2><form id="checkout-form" class="checkout-form"><label>Full name<input name="name" autocomplete="name" required></label><label>Email address<input type="email" name="email" autocomplete="email" required></label><label>Phone number<input type="tel" name="phone" autocomplete="tel" required></label><label>Address<textarea name="address" autocomplete="street-address" required></textarea></label><button class="button" type="submit">Place Order →</button></form></section><aside id="checkout-summary" class="summary-panel"></aside></div></main>
  <footer class="site-footer-mini">Secure, thoughtful, handmade</footer>
</body>
</html>
